name: Validate application
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: classroom
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: classroom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U classroom -d classroom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://classroom:ci-ephemeral-only@127.0.0.1:5432/classroom
      RATE_LIMIT_SECRET: ci-only-not-for-deployment
      APP_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: cp .env.example .env
      - run: npm ci
      - run: npm run db:migrate && npm run db:seed
      - run: npm run check
      - run: npm audit --omit=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
