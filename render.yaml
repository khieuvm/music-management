# Public demo on Render (free plan). Create it with: Render Dashboard → New → Blueprint → pick this repo.
# Free plan limits: the web service sleeps after ~15 minutes idle (first visit takes ~1 minute),
# uploaded videos are lost when it restarts, and the free database expires after 30 days.
services:
  - type: web
    name: music-management
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    # Migrations + idempotent demo seed run on every start (free plan has no pre-deploy step).
    startCommand: npm run start:demo
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: music-management-db
          property: connectionString
      - key: RATE_LIMIT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: STORAGE_DIR
        value: ./storage
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: TRUST_PROXY
        value: "false"

databases:
  - name: music-management-db
    plan: free
    region: singapore
    databaseName: classroom
    user: classroom
